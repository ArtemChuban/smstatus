name: Rust Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: rust-doctor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cache rust-doctor global install
        id: rust-doctor-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: rust-doctor-0.6.0-${{ runner.os }}

      - name: Install rust-doctor
        run: |
          mkdir -p ~/.npm-global
          npm config set prefix ~/.npm-global
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x ~/.npm-global/bin/rust-doctor ]; then
            npm install -g rust-doctor@0.6.0
          fi

      - name: Inspect the workspace
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"

          set +e
          rust-doctor . --yes --verbose --scope baseline --base "origin/$BASE_REF" > scan.txt 2>&1
          scan_status=$?
          set -e

          {
            echo '## Rust Doctor'
            echo
            echo '```'
            cat scan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$scan_status"
