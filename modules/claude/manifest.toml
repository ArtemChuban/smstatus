name = "claude"
display_name = "Claude"
version = "0.1.0"
author = "ArtemChuban"
modules-api = { major = 0, minor = 1 }
required_extensions = [
  { name = "fs", version = { major = 0, minor = 1 } },
  { name = "http", version = { major = 0, minor = 1 } },
  { name = "time", version = { major = 0, minor = 1 } },
]

[[permissions]]
extension = "time"
method = "now"

[[permissions]]
extension = "fs"
method = "read"
path_prefixes = ["~/.claude/"]

[[permissions]]
extension = "http"
method = "get"
url_prefixes = ["https://api.anthropic.com/"]
