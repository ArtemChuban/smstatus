[workspace]
members = ["modules/battery", "modules/datetime", "modules/keyboard", "modules/disk", "modules/ram"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wit-bindgen = "0.60.0"

[package]
name = "smstatus"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
dirs = "6.0.0"
nix = { version = "0.29", features = ["fs"] }
notify = "8.2.0"
serde_json = { workspace = true }
toml = "1.1.4"
wasmtime = { version = "47.0.3", features = ["component-model"] }
wasmtime-wasi = "47.0.3"
x11rb = { version = "0.14.0", features = ["xkb"] }
