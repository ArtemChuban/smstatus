[workspace]
members = ["modules/battery", "modules/datetime", "modules/keyboard", "modules/disk", "modules/ram", "modules/cpu", "modules/process", "modules/claude", "packages/fmt-common", "packages/extension-protocol", "extensions/echo"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wit-bindgen = "0.60.0"
extension-protocol = { path = "packages/extension-protocol" }

[package]
name = "smstatus"
version = "0.1.0"
edition = "2024"

[lib]
name = "smstatus"
path = "src/lib.rs"
doctest = false

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6.0.0"
log = "0.4"
nix = { version = "0.29", features = ["fs", "signal"] }
notify = "8.2.0"
ratatui = "0.30"
serde = { workspace = true }
serde_json = { workspace = true }
extension-protocol = { workspace = true }
toml = "1.1.4"
toml_edit = "0.25"
unicode-width = "0.2"
ureq = "3.4"
wasmtime = { version = "47.0.3", default-features = false, features = ["component-model", "cranelift", "async", "runtime", "std"] }
wasmtime-wasi = { version = "47.0.3", default-features = false, features = ["p2"] }
x11rb = { version = "0.14.0", features = ["xkb"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
